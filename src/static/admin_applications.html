<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIScore — Applications</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue:   #0071e3;
      --blue-h: #0077ed;
      --green:  #34c759;
      --red:    #ff3b30;
      --orange: #ff9500;
      --gray-6: #6e6e73;
      --gray-d: #d2d2d7;
      --gray-f: #f5f5f7;
      --black:  #1d1d1f;
      --white:  #ffffff;
      --nav-h:  56px;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 2px 16px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--gray-f);
      color: var(--black);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* Nav */
    .topnav {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: rgba(255,255,255,0.88);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid var(--gray-d);
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      gap: 1rem;
      z-index: 100;
    }

    .topnav-logo { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.4px; color: var(--blue); text-decoration: none; }
    .topnav-sep  { color: var(--gray-d); font-size: 1.2rem; }
    .topnav-title { font-size: 0.9rem; font-weight: 600; color: var(--gray-6); }
    .topnav-right { margin-left: auto; display: flex; align-items: center; gap: 0.75rem; }

    .topnav-link {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gray-6);
      text-decoration: none;
      padding: 0.3rem 0.6rem;
      border-radius: var(--radius-sm);
      transition: background 0.1s, color 0.1s;
    }
    .topnav-link:hover { background: var(--gray-f); color: var(--black); }

    /* Main */
    .main {
      padding-top: calc(var(--nav-h) + 2rem);
      padding-bottom: 4rem;
      max-width: 1100px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .page-header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    .page-header p  { color: var(--gray-6); font-size: 0.875rem; margin-top: 0.2rem; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.12s, transform 0.08s;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--blue); color: var(--white); }
    .btn-primary:hover { background: var(--blue-h); }
    .btn-ghost { background: var(--white); color: var(--black); border: 1px solid var(--gray-d); }
    .btn-ghost:hover { background: #ebebf0; }

    /* Filter chips */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .filter-chip {
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      border: 1.5px solid var(--gray-d);
      background: var(--white);
      color: var(--gray-6);
      transition: all 0.12s;
      white-space: nowrap;
    }
    .filter-chip:hover { border-color: var(--blue); color: var(--blue); }
    .filter-chip.active { background: var(--blue); border-color: var(--blue); color: var(--white); }

    .search-box {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--white);
      border: 1.5px solid var(--gray-d);
      border-radius: var(--radius-sm);
      padding: 0.5rem 0.75rem;
      flex: 1;
      max-width: 280px;
      transition: border-color 0.15s;
    }
    .search-box:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,113,227,0.1); }
    .search-box input { border: none; outline: none; background: none; font-size: 0.875rem; color: var(--black); width: 100%; font-family: inherit; }
    .search-box input::placeholder { color: var(--gray-6); }

    /* Table */
    .table-wrap {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .table-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--gray-f);
    }
    .table-meta-count { font-size: 0.8rem; color: var(--gray-6); }
    .table-meta-count strong { color: var(--black); }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      text-align: left;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--gray-6);
      padding: 0.65rem 1rem;
      background: var(--gray-f);
      border-bottom: 1px solid var(--gray-d);
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid var(--gray-f);
      transition: background 0.1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(0,113,227,0.03); }

    td {
      padding: 0.85rem 1rem;
      font-size: 0.875rem;
      vertical-align: middle;
    }

    .td-company { font-weight: 600; }
    .td-sub { font-size: 0.75rem; color: var(--gray-6); margin-top: 0.1rem; }
    .td-link { color: var(--blue); text-decoration: none; font-size: 0.8rem; }
    .td-link:hover { text-decoration: underline; }

    /* Status chips */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .chip::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.7;
      flex-shrink: 0;
    }

    .chip-applied      { background: rgba(0,113,227,0.1);   color: #0051a3; }
    .chip-under_review { background: rgba(255,149,0,0.12);  color: #c06600; }
    .chip-approved     { background: rgba(52,199,89,0.12);  color: #1a8a3c; }
    .chip-rejected     { background: rgba(255,59,48,0.1);   color: #c0392b; }

    /* Review button in table */
    .review-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--blue);
      background: rgba(0,113,227,0.08);
      border: 1px solid rgba(0,113,227,0.2);
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.1s;
    }
    .review-btn:hover { background: rgba(0,113,227,0.14); }

    /* Empty / loading */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--gray-6);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; }
    .empty-state p { font-size: 0.9rem; }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid var(--gray-d);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-row td { text-align: center; padding: 3rem; color: var(--gray-6); }

    /* Toast */
    .toast-wrap { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 500; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: var(--black); color: var(--white); padding: 0.75rem 1.1rem; border-radius: var(--radius-sm); font-size: 0.875rem; font-weight: 500; box-shadow: 0 4px 16px rgba(0,0,0,0.2); animation: slideUp 0.2s ease; max-width: 320px; }
    .toast.error { background: #c0392b; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    /* UNDER_REVIEW highlight row */
    tbody tr.row-under_review { background: rgba(255,149,0,0.04); }
    tbody tr.row-under_review:hover { background: rgba(255,149,0,0.08); }
  </style>
</head>
<body>

<nav class="topnav">
  <a class="topnav-logo" href="/apply">AIScore</a>
  <span class="topnav-sep">/</span>
  <span class="topnav-title">Applications</span>
  <div class="topnav-right">
    <a class="topnav-link" href="/admin">Full Dashboard</a>
    <button class="btn btn-ghost" onclick="loadData()" style="padding:0.4rem 0.65rem;" title="Refresh">⟳</button>
  </div>
</nav>

<main class="main">
  <div class="page-header" id="pageHeader">
    <div>
      <h1>Applications</h1>
      <p>Review incoming applications — approve or reject to advance them through the pipeline</p>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-box">
      <span style="color:var(--gray-6);">🔍</span>
      <input type="text" id="searchInput" placeholder="Search company, email…" oninput="renderTable()" />
    </div>

    <button class="filter-chip active" data-status="" onclick="setFilter(this, '')">All</button>
    <button class="filter-chip" data-status="APPLIED" onclick="setFilter(this, 'APPLIED')">Applied</button>
    <button class="filter-chip" data-status="UNDER_REVIEW" onclick="setFilter(this, 'UNDER_REVIEW')">Under Review</button>
    <button class="filter-chip" data-status="APPROVED" onclick="setFilter(this, 'APPROVED')">Approved</button>
    <button class="filter-chip" data-status="REJECTED" onclick="setFilter(this, 'REJECTED')">Rejected</button>
  </div>

  <!-- Table -->
  <div class="table-wrap" id="tableWrap">
    <div class="table-meta">
      <div class="table-meta-count" id="tableCount">Loading…</div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Contact email</th>
          <th>Website</th>
          <th>Status</th>
          <th>Submitted</th>
          <th style="width:100px;">Action</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="loading-row">
          <td colspan="6">
            <div class="spinner"></div>
            <p style="margin-top:0.75rem;">Loading applications…</p>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<div class="toast-wrap" id="toastWrap"></div>

<script>
let allApplications = [];
let activeFilter = '';

const STATUS_LABELS = {
  APPLIED: 'Applied',
  UNDER_REVIEW: 'Under Review',
  APPROVED: 'Approved',
  REJECTED: 'Rejected',
  CALLED: 'Meeting Booked',
  AWAITING_PAYMENT: 'Awaiting Payment',
  PAID: 'Paid',
  IN_PRODUCTION: 'In Production',
  QC_REVIEW: 'QC Review',
  QC_PASSED: 'QC Passed',
  QC_FAILED: 'QC Failed',
  ESCALATED: 'Escalated',
  CANCELLED: 'Cancelled',
  READY_FOR_REVIEW_CALL: 'Ready for Review',
};

async function loadData() {
  try {
    const res = await fetch('/api/v1/admin/applications?limit=200');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allApplications = await res.json();
  } catch (err) {
    toast('Failed to load applications: ' + err.message, 'error');
    allApplications = [];
  }
  renderTable();
}

function setFilter(el, status) {
  activeFilter = status;
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.status === status);
  });
  renderTable();
}

function getFiltered() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  return allApplications.filter(a => {
    if (activeFilter && a.status !== activeFilter) return false;
    if (search) {
      const hay = [
        a.firmanavn || a.company_name || '',
        a.kontaktperson || a.contact_name || '',
        a.email || a.contact_email || '',
        a.website || '',
      ].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

function renderTable() {
  const data = getFiltered();
  const tbody = document.getElementById('tableBody');

  document.getElementById('tableCount').innerHTML =
    `Showing <strong>${data.length}</strong> of <strong>${allApplications.length}</strong> applications` +
    (activeFilter ? ` — filtered by <strong>${STATUS_LABELS[activeFilter] || activeFilter}</strong>` : '');

  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="6">
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>No applications match the current filter.</p>
      </div>
    </td></tr>`;
    return;
  }

  // Sort: UNDER_REVIEW first, then APPLIED, then others by date
  const ORDER = { UNDER_REVIEW: 0, APPLIED: 1 };
  const sorted = [...data].sort((a, b) => {
    const oa = ORDER[a.status] ?? 99;
    const ob = ORDER[b.status] ?? 99;
    if (oa !== ob) return oa - ob;
    return new Date(b.created_at) - new Date(a.created_at);
  });

  const canReview = s => ['APPLIED', 'UNDER_REVIEW'].includes(s);

  tbody.innerHTML = sorted.map(a => {
    const company = esc(a.firmanavn || a.company_name || '—');
    const email   = esc(a.email || a.contact_email || '—');
    const website = a.website || '';
    const status  = a.status || '';
    const rowClass = status === 'UNDER_REVIEW' ? 'row-under_review' : '';
    const submitted = a.submitted_at || a.created_at;

    const reviewLink = canReview(status)
      ? `<a class="review-btn" href="/admin/applications/${esc(a.id)}/review">Review →</a>`
      : `<span style="color:var(--gray-6);font-size:0.78rem;">${esc(STATUS_LABELS[status] || status)}</span>`;

    return `
      <tr class="${rowClass}">
        <td><div class="td-company">${company}</div></td>
        <td><a class="td-link" href="mailto:${email}">${email}</a></td>
        <td>${website
          ? `<a class="td-link" href="${esc(website)}" target="_blank" rel="noopener">${esc(website.replace(/^https?:\/\//,'').replace(/\/$/,''))}</a>`
          : '—'
        }</td>
        <td>${statusChip(status)}</td>
        <td>
          <div>${fmtDate(submitted)}</div>
          <div class="td-sub">${fmtTime(submitted)}</div>
        </td>
        <td>${reviewLink}</td>
      </tr>
    `;
  }).join('');
}

function statusChip(status) {
  const label = STATUS_LABELS[status] || status;
  const cls   = 'chip-' + status.toLowerCase();
  return `<span class="chip ${cls}">${esc(label)}</span>`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function toast(msg, type = '') {
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

loadData();
</script>
</body>
</html>
