<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIScore — Applications</title>
  <link rel="stylesheet" href="/static/shared.css" />
  <script src="/static/i18n.js"></script>
  <style>
    body { min-height: 100vh; font-size: 14px; line-height: 1.5; }

    .main {
      padding-top: calc(var(--nav-h) + 2rem);
      padding-bottom: 4rem;
      max-width: 1100px;
      margin: 0 auto;
      padding-left: 2rem;
      padding-right: 2rem;
    }

    @media (max-width: 640px) {
      .main { padding-left: 1rem; padding-right: 1rem; }
    }

    /* ── Review button in table ── */
    .review-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      border: 1px solid rgba(59,130,246,0.2);
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.1s;
    }
    .review-btn:hover { background: rgba(59,130,246,0.14); }

    /* ── UNDER_REVIEW row highlight ── */
    tbody tr.row-under_review { background: rgba(245,158,11,0.04); }
    tbody tr.row-under_review:hover { background: rgba(245,158,11,0.08); }
  </style>
</head>
<body>

<nav class="topnav">
  <a class="topnav-logo" href="/apply">
    <i data-lucide="bar-chart-2" class="icon-sm"></i>
    AIScore
  </a>
  <span class="topnav-sep">/</span>
  <span class="topnav-title">Applications</span>
  <div class="topnav-right">
    <div class="lang-toggle" role="group" aria-label="Language / Sprog">
      <button class="lang-opt lang-active" data-lang="en" onclick="i18n.setLang('en')" aria-label="English">EN</button>
      <span class="lang-sep">|</span>
      <button class="lang-opt" data-lang="da" onclick="i18n.setLang('da')" aria-label="Dansk">DA</button>
    </div>
    <a class="topnav-link" href="/admin">Full Dashboard</a>
    <button class="btn btn-ghost" onclick="loadData()" style="padding:0.4rem 0.65rem;" title="Refresh">
      <i data-lucide="refresh-cw" class="icon-sm"></i>
    </button>
  </div>
</nav>

<main class="main">
  <div class="page-header" id="pageHeader">
    <div>
      <h1>Applications</h1>
      <p>Review incoming applications — approve or reject to advance them through the pipeline</p>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-box" style="flex:1;max-width:280px;">
      <i data-lucide="search" class="icon-sm search-icon"></i>
      <input type="text" id="searchInput" placeholder="Search company, email…" oninput="renderTable()" />
    </div>

    <button class="filter-chip active" data-status="" onclick="setFilter(this, '')">All</button>
    <button class="filter-chip" data-status="APPLIED" onclick="setFilter(this, 'APPLIED')">Applied</button>
    <button class="filter-chip" data-status="UNDER_REVIEW" onclick="setFilter(this, 'UNDER_REVIEW')">Under Review</button>
    <button class="filter-chip" data-status="APPROVED" onclick="setFilter(this, 'APPROVED')">Approved</button>
    <button class="filter-chip" data-status="REJECTED" onclick="setFilter(this, 'REJECTED')">Rejected</button>
  </div>

  <!-- Table -->
  <div class="table-wrap" id="tableWrap">
    <div class="table-meta">
      <div class="table-meta-count" id="tableCount">Loading…</div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Contact email</th>
          <th>Website</th>
          <th>Status</th>
          <th>Submitted</th>
          <th style="width:100px;">Action</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr class="loading-row">
          <td colspan="6">
            <div class="spinner"></div>
            <p style="margin-top:0.75rem;">Loading applications…</p>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<div class="toast-wrap" id="toastWrap"></div>

<script src="/static/assets/icons.js"></script>
<script>
let allApplications = [];
let activeFilter = '';

const STATUS_LABELS = {
  APPLIED: 'Applied',
  UNDER_REVIEW: 'Under Review',
  APPROVED: 'Approved',
  REJECTED: 'Rejected',
  CALLED: 'Meeting Booked',
  AWAITING_PAYMENT: 'Awaiting Payment',
  PAID: 'Paid',
  IN_PRODUCTION: 'In Production',
  QC_REVIEW: 'QC Review',
  QC_PASSED: 'QC Passed',
  QC_FAILED: 'QC Failed',
  ESCALATED: 'Escalated',
  CANCELLED: 'Cancelled',
  READY_FOR_REVIEW_CALL: 'Ready for Review',
};

async function loadData() {
  try {
    const res = await fetch('/api/v1/admin/applications?limit=200');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    allApplications = await res.json();
  } catch (err) {
    toast('Failed to load applications: ' + err.message, 'error');
    allApplications = [];
  }
  renderTable();
}

function setFilter(el, status) {
  activeFilter = status;
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.status === status);
  });
  renderTable();
}

function getFiltered() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  return allApplications.filter(a => {
    if (activeFilter && a.status !== activeFilter) return false;
    if (search) {
      const hay = [
        a.firmanavn || a.company_name || '',
        a.kontaktperson || a.contact_name || '',
        a.email || a.contact_email || '',
        a.website || '',
      ].join(' ').toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

function renderTable() {
  const data = getFiltered();
  const tbody = document.getElementById('tableBody');

  document.getElementById('tableCount').innerHTML =
    `Showing <strong>${data.length}</strong> of <strong>${allApplications.length}</strong> applications` +
    (activeFilter ? ` — filtered by <strong>${STATUS_LABELS[activeFilter] || activeFilter}</strong>` : '');

  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="6">
      <div class="empty-state">
        <div class="icon"><i data-lucide="inbox" style="width:40px;height:40px;opacity:0.35;"></i></div>
        <p>No applications match the current filter.</p>
      </div>
    </td></tr>`;
    if (window.lucide) lucide.createIcons();
    return;
  }

  // Sort: UNDER_REVIEW first, then APPLIED, then others by date
  const ORDER = { UNDER_REVIEW: 0, APPLIED: 1 };
  const sorted = [...data].sort((a, b) => {
    const oa = ORDER[a.status] ?? 99;
    const ob = ORDER[b.status] ?? 99;
    if (oa !== ob) return oa - ob;
    return new Date(b.created_at) - new Date(a.created_at);
  });

  const canReview = s => ['APPLIED', 'UNDER_REVIEW'].includes(s);

  tbody.innerHTML = sorted.map(a => {
    const company = esc(a.firmanavn || a.company_name || '—');
    const email   = esc(a.email || a.contact_email || '—');
    const website = a.website || '';
    const status  = a.status || '';
    const rowClass = status === 'UNDER_REVIEW' ? 'row-under_review' : '';
    const submitted = a.submitted_at || a.created_at;

    const reviewLink = canReview(status)
      ? `<a class="review-btn" href="/admin/applications/${esc(a.id)}/review">
           <i data-lucide="arrow-right" class="icon-xs"></i>
           Review
         </a>`
      : `<span style="color:var(--text-muted);font-size:0.78rem;">${esc(STATUS_LABELS[status] || status)}</span>`;

    return `
      <tr class="${rowClass}">
        <td><div class="td-company">${company}</div></td>
        <td><a class="td-link" href="mailto:${email}">${email}</a></td>
        <td>${website
          ? `<a class="td-link" href="${esc(website)}" target="_blank" rel="noopener">${esc(website.replace(/^https?:\/\//,'').replace(/\/$/,''))}</a>`
          : '—'
        }</td>
        <td>${statusChip(status)}</td>
        <td>
          <div>${fmtDate(submitted)}</div>
          <div class="td-sub">${fmtTime(submitted)}</div>
        </td>
        <td>${reviewLink}</td>
      </tr>
    `;
  }).join('');

  if (window.lucide) lucide.createIcons();
}

function statusChip(status) {
  const label = STATUS_LABELS[status] || status;
  const cls   = 'chip-' + status.toLowerCase();
  return `<span class="chip ${cls}">${esc(label)}</span>`;
}

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function toast(msg, type = '') {
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

document.addEventListener('DOMContentLoaded', () => {
  if (window.i18n) window.i18n.applyTranslations();
  if (window.lucide) lucide.createIcons();
  loadData();
});

document.addEventListener('langchange', () => {
  if (window.i18n) window.i18n.applyTranslations();
});
</script>
</body>
</html>
