<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ansøg om AIScore</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
      max-width: 560px;
      width: 100%;
      padding: 3rem 2.5rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #0071e3;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: #6e6e73;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #1d1d1f;
    }

    input, textarea {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid #d2d2d7;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #1d1d1f;
      background: #fff;
      transition: border-color 0.15s;
      outline: none;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: #0071e3;
      box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.85rem;
      background: #0071e3;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 0.5rem;
    }

    .btn:hover { background: #0077ed; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: #a8a8b3; cursor: not-allowed; }

    .success {
      display: none;
      text-align: center;
      padding: 2rem 0;
    }

    .success-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .success h2 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .success p {
      color: #6e6e73;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .error-msg {
      display: none;
      background: #fff0f0;
      border: 1.5px solid #ff3b30;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      color: #ff3b30;
      font-size: 0.875rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">AIScore</div>
    <h1>Ansøg om adgang</h1>
    <p class="subtitle">
      AIScore er kun tilgængeligt for godkendte virksomheder. Udfyld formularen nedenfor,
      og vi vender tilbage inden for 2 hverdage.
    </p>

    <form id="applyForm">
      <div class="field">
        <label for="firmanavn">Virksomhedsnavn *</label>
        <input type="text" id="firmanavn" name="firmanavn" required placeholder="Eks. Acme ApS" />
      </div>

      <div class="field">
        <label for="website">Website *</label>
        <input type="url" id="website" name="website" required placeholder="https://example.dk" />
      </div>

      <div class="field">
        <label for="kontaktperson">Kontaktperson *</label>
        <input type="text" id="kontaktperson" name="kontaktperson" required placeholder="Fulde navn" />
      </div>

      <div class="field">
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" required placeholder="navn@virksomhed.dk" />
      </div>

      <div class="field">
        <label for="telefon">Telefon *</label>
        <input type="tel" id="telefon" name="telefon" required placeholder="+45 12 34 56 78" />
      </div>

      <div class="field">
        <label for="virksomhedsinfo">Om virksomheden *</label>
        <textarea
          id="virksomhedsinfo"
          name="virksomhedsinfo"
          required
          minlength="10"
          placeholder="Beskriv kort hvad jeres virksomhed laver, og hvorfor I er interesseret i AIScore..."
        ></textarea>
      </div>

      <button type="submit" class="btn" id="submitBtn">Send ansøgning</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="success" id="successBox">
      <div class="success-icon">✅</div>
      <h2>Ansøgning modtaget!</h2>
      <p>
        Tak for din interesse i AIScore.<br />
        Vi gennemgår din ansøgning og vender tilbage på <strong id="confirmedEmail"></strong>
        inden for 2 hverdage.
      </p>
    </div>
  </div>

  <script>
    document.getElementById("applyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const errorMsg = document.getElementById("errorMsg");
      errorMsg.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Sender...";

      const payload = {
        firmanavn: document.getElementById("firmanavn").value.trim(),
        website: document.getElementById("website").value.trim(),
        kontaktperson: document.getElementById("kontaktperson").value.trim(),
        email: document.getElementById("email").value.trim(),
        telefon: document.getElementById("telefon").value.trim(),
        virksomhedsinfo: document.getElementById("virksomhedsinfo").value.trim(),
      };

      try {
        const res = await fetch("/api/v1/apply", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || `Server fejl (${res.status})`);
        }

        document.getElementById("confirmedEmail").textContent = payload.email;
        document.getElementById("applyForm").style.display = "none";
        document.getElementById("successBox").style.display = "block";
      } catch (err) {
        errorMsg.textContent = err.message || "Noget gik galt. Prøv igen.";
        errorMsg.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Send ansøgning";
      }
    });
  </script>
</body>
</html>
