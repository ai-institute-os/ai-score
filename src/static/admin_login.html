<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — AIScore</title>
  <link rel="stylesheet" href="/static/shared.css" />
  <style>
    html, body {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }

    .login-wrap {
      width: 100%;
      max-width: 380px;
      padding: 2rem;
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      text-decoration: none;
    }

    .login-logo-icon {
      width: 34px;
      height: 34px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-logo-text {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    .login-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow);
    }

    .login-card h1 {
      font-family: var(--font-heading);
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .login-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
    }

    .field { margin-bottom: 1.25rem; }

    .field label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .field input {
      width: 100%;
      padding: 0.65rem 0.875rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.875rem;
      color: var(--text);
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
    }

    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-light);
    }

    .field input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px var(--error-light);
    }

    .login-btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .login-btn:hover { background: var(--primary-h); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      display: none;
      margin-top: 0.75rem;
      padding: 0.6rem 0.875rem;
      background: var(--error-light);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      color: var(--error);
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <a href="/" class="login-logo">
      <div class="login-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>
        </svg>
      </div>
      <span class="login-logo-text">AIScore</span>
    </a>

    <div class="login-card">
      <h1>Admin login</h1>
      <p>Enter your admin key to access the dashboard.</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="admin_key">Admin key</label>
          <input type="password" id="admin_key" name="admin_key"
            placeholder="Enter admin key"
            autocomplete="current-password" />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
        <div class="error-msg" id="errorMsg">Invalid admin key. Please try again.</div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errMsg = document.getElementById('errorMsg');
      const keyInput = document.getElementById('admin_key');

      const key = keyInput.value.trim();
      if (!key) {
        keyInput.classList.add('error');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      errMsg.style.display = 'none';
      keyInput.classList.remove('error');

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admin_key: key }),
        });

        if (res.ok) {
          const data = await res.json();
          window.location.href = data.redirect || '/admin';
        } else {
          keyInput.classList.add('error');
          errMsg.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      } catch {
        errMsg.textContent = 'Connection error. Please try again.';
        errMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });

    document.getElementById('admin_key').addEventListener('input', function() {
      this.classList.remove('error');
    });
  </script>
</body>
</html>
