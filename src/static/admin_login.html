<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — AIScore Admin</title>
  <link rel="stylesheet" href="/static/shared.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      font-family: var(--font-sans);
    }

    .login-shell {
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
    }

    /* ── Logo ── */
    .login-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2.5rem;
      text-decoration: none;
    }
    .login-logo-mark {
      width: 36px;
      height: 36px;
      background: var(--primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .login-logo-name {
      font-family: var(--font-heading);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: var(--text);
    }

    /* ── Card ── */
    .login-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 2.25rem 2rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04);
    }

    .login-eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      margin-bottom: 0.5rem;
    }

    .login-card h1 {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text);
      margin: 0 0 0.35rem;
    }

    .login-card .login-sub {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin: 0 0 2rem;
      line-height: 1.5;
    }

    /* ── Fields ── */
    .field { margin-bottom: 1.25rem; }

    .field label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.45rem;
    }

    .input-wrap {
      position: relative;
    }

    .field input {
      width: 100%;
      padding: 0.7rem 2.75rem 0.7rem 0.9rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--text);
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
      outline: none;
      letter-spacing: 0.02em;
    }

    .field input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }

    .field input.error {
      border-color: var(--error);
      box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
    }

    .toggle-pw {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: var(--text-muted);
      display: flex;
      align-items: center;
    }
    .toggle-pw:hover { color: var(--text); }

    /* ── Error banner ── */
    .error-banner {
      display: none;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding: 0.65rem 0.875rem;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #dc2626;
      font-weight: 500;
    }

    /* ── Submit button ── */
    .login-btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: var(--font-sans);
      font-size: 0.925rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
      letter-spacing: -0.01em;
    }
    .login-btn:hover { background: var(--primary-h); box-shadow: 0 2px 8px rgba(59,130,246,0.3); }
    .login-btn:active { background: var(--primary-h); box-shadow: none; }
    .login-btn:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }

    /* ── Footer note ── */
    .login-footer {
      margin-top: 1.75rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .login-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .login-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-shell">
    <a href="/" class="login-logo">
      <div class="login-logo-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6"  y1="20" x2="6"  y2="14"/>
        </svg>
      </div>
      <span class="login-logo-name">AIScore</span>
    </a>

    <div class="login-card">
      <div class="login-eyebrow">Admin portal</div>
      <h1>Welcome back</h1>
      <p class="login-sub">Sign in to access the AIScore admin dashboard.</p>

      <div class="error-banner" id="errorBanner">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorText">Incorrect password. Please try again.</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="admin_key">Password</label>
          <div class="input-wrap">
            <input type="password" id="admin_key" name="admin_key"
              placeholder="Enter your password"
              autocomplete="current-password"
              autofocus />
            <button type="button" class="toggle-pw" id="togglePw" tabindex="-1" aria-label="Show password">
              <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
      </form>

      <div class="login-footer">
        <a href="/">← Back to AIScore</a>
      </div>
    </div>
  </div>

  <script>
    const form    = document.getElementById('loginForm');
    const btn     = document.getElementById('loginBtn');
    const input   = document.getElementById('admin_key');
    const banner  = document.getElementById('errorBanner');
    const errText = document.getElementById('errorText');
    const togglePw = document.getElementById('togglePw');

    togglePw.addEventListener('click', () => {
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      document.getElementById('eyeIcon').innerHTML = show
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    function showError(msg) {
      errText.textContent = msg || 'Incorrect password. Please try again.';
      banner.style.display = 'flex';
      input.classList.add('error');
    }

    function clearError() {
      banner.style.display = 'none';
      input.classList.remove('error');
    }

    input.addEventListener('input', clearError);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = input.value.trim();
      if (!key) { input.classList.add('error'); input.focus(); return; }

      btn.disabled = true;
      btn.textContent = 'Signing in…';
      clearError();

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ admin_key: key }),
        });

        if (res.ok) {
          const params = new URLSearchParams(window.location.search);
          const next = params.get('next');
          window.location.href = (next && next.startsWith('/admin')) ? next : '/admin';
        } else {
          showError('Incorrect password. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Sign in';
          input.select();
        }
      } catch {
        showError('Connection error — please try again.');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
